<p-toolbar styleClass="mb-4">
  <ng-template #start>
    <p-button
      *appHasPermission="Permissions.MaintenanceChecklist.Create"
      label="New"
      icon="pi pi-plus"
      severity="secondary"
      (onClick)="openNew()" />
  </ng-template>
</p-toolbar>

<p-table
  [value]="rows()"
  [rows]="filter.pageSize"
  [paginator]="true"
  [lazy]="true"
  [totalRecords]="totalRecords"
  [rowHover]="true"
  [rowsPerPageOptions]="[10, 20, 30]"
  (onPage)="onPage($event)"
  dataKey="id">
  <ng-template #caption>
    <div class="flex justify-between items-center flex-wrap gap-2">
      <h5 class="m-0">Maintenance Checklists</h5>
      <div class="flex gap-2 flex-wrap items-center">
        <p-select
          *ngIf="systemAdmin"
          [options]="tenantFilterOptions"
          [(ngModel)]="filter.tenantId"
          optionLabel="label"
          optionValue="value"
          placeholder="All tenants"
          [style]="{ minWidth: '12rem' }"
          (onChange)="onTenantFilterChange()" />
        <p-iconfield>
          <p-inputicon styleClass="pi pi-search" />
          <input pInputText type="text" [(ngModel)]="filter.searchText" (keydown.enter)="onSearch()" placeholder="Search..." />
        </p-iconfield>
      </div>
    </div>
  </ng-template>
  <ng-template #header>
    <tr>
      <th>Code</th>
      <th>Name</th>
      <th>Type</th>
      <th *ngIf="systemAdmin">Tenant</th>
      <th>Version</th>
      <th>Active</th>
      <th style="width: 8rem"></th>
    </tr>
  </ng-template>
  <ng-template #body let-r>
    <tr>
      <td>{{ r.code }}</td>
      <td>{{ r.name }}</td>
      <td>{{ r.maintenanceTypeName || '—' }}</td>
      <td *ngIf="systemAdmin">{{ r.tenantName || '-' }}</td>
      <td>{{ r.version }}</td>
      <td>
        <p-tag [value]="r.isActive ? 'Active' : 'Inactive'" [severity]="r.isActive ? 'success' : 'danger'" />
      </td>
      <td class="text-end">
        <p-button
          *appHasPermission="Permissions.MaintenanceChecklist.Update"
          icon="pi pi-pencil"
          [rounded]="true"
          [outlined]="true"
          (onClick)="openEdit(r)" />
      </td>
    </tr>
  </ng-template>
</p-table>

<p-drawer
  [(visible)]="drawerVisible"
  position="right"
  [modal]="true"
  [blockScroll]="true"
  [closeOnEscape]="true"
  [showCloseIcon]="true"
  [style]="{ width: '520px' }"
  [header]="isEditing ? 'Edit Checklist' : 'Create Checklist'">
  <form [formGroup]="form" class="flex flex-col gap-4">
    <div class="flex flex-col gap-2" *ngIf="systemAdmin">
      <label for="clTenant">Tenant</label>
      <p-select
        inputId="clTenant"
        formControlName="tenantId"
        [options]="tenantsForForm"
        optionLabel="displayName"
        optionValue="id"
        placeholder="Select tenant"
        appendTo="body"
        styleClass="w-full" />
      <small *ngIf="submitted && form.controls['tenantId'].invalid" class="text-red-500">Tenant is required.</small>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="flex flex-col gap-2">
        <label for="clCode">Code</label>
        <input pInputText id="clCode" formControlName="code" />
        <small *ngIf="submitted && form.controls['code'].invalid" class="text-red-500">Code is required.</small>
      </div>
      <div class="flex flex-col gap-2">
        <label for="clName">Name</label>
        <input pInputText id="clName" formControlName="name" />
        <small *ngIf="submitted && form.controls['name'].invalid" class="text-red-500">Name is required.</small>
      </div>
    </div>

    <div class="flex flex-col gap-2">
      <label for="clType">Maintenance type</label>
      <p-select
        inputId="clType"
        formControlName="maintenanceTypeId"
        [options]="maintenanceTypes"
        optionLabel="label"
        optionValue="value"
        placeholder="Optional"
        [showClear]="true"
        appendTo="body"
        styleClass="w-full" />
    </div>

    <div class="flex flex-col gap-2">
      <label for="clDescription">Description</label>
      <textarea pTextarea id="clDescription" formControlName="description" rows="3"></textarea>
    </div>

    <div class="flex items-center gap-2">
      <p-checkbox formControlName="isActive" inputId="clActive" [binary]="true"></p-checkbox>
      <label for="clActive">Active</label>
    </div>

    <div>
      <label class="font-semibold mb-2 block">Checklist items</label>
      <div formArrayName="items">
        <ng-container *ngFor="let _ of items.controls; let i = index">
          <p-card class="p-card-sm mb-3">
            <div [formGroupName]="i" class="flex flex-col gap-3">
              <div class="flex justify-between items-center">
                <strong>Item {{ i + 1 }}</strong>
                <p-button icon="pi pi-times" severity="danger" text size="small" (onClick)="removeItem(i)" [disabled]="items.length <= 1" />
              </div>

              <div class="flex flex-col gap-2">
                <label [for]="'clItemText' + i">Item text</label>
                <input pInputText [id]="'clItemText' + i" formControlName="itemText" />
                <small *ngIf="submitted && items.at(i).get('itemText')?.invalid" class="text-red-500">Item text is required.</small>
              </div>

              <div class="flex flex-col gap-2">
                <label [for]="'clItemDesc' + i">Description</label>
                <textarea pTextarea [id]="'clItemDesc' + i" formControlName="description" rows="2"></textarea>
              </div>

              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="flex flex-col gap-2">
                  <label [for]="'clResp' + i">Response type</label>
                  <p-select
                    [inputId]="'clResp' + i"
                    formControlName="responseType"
                    [options]="responseTypes"
                    optionLabel="label"
                    optionValue="value"
                    appendTo="body"
                    styleClass="w-full" />
                </div>
                <div class="flex flex-col gap-2">
                  <label [for]="'clSort' + i">Sort order</label>
                  <p-inputNumber [inputId]="'clSort' + i" formControlName="sortOrder" styleClass="w-full" />
                </div>
              </div>

              <div class="flex flex-wrap items-center gap-4">
                <div class="flex items-center gap-2">
                  <p-checkbox formControlName="isRequired" [inputId]="'clReq' + i" [binary]="true"></p-checkbox>
                  <label [for]="'clReq' + i">Required</label>
                </div>
                <div class="flex items-center gap-2">
                  <p-checkbox formControlName="isActive" [inputId]="'clItemActive' + i" [binary]="true"></p-checkbox>
                  <label [for]="'clItemActive' + i">Active</label>
                </div>
              </div>

              <div *ngIf="isSelectionType(i)" class="flex flex-col gap-2">
                <label class="font-semibold">Options</label>
                <div formArrayName="options">
                  <div *ngFor="let __ of itemOptions(i).controls; let j = index" [formGroupName]="j" class="flex gap-2 mb-2 items-start">
                    <input pInputText class="flex-1" formControlName="optionText" placeholder="Option text" />
                    <p-button icon="pi pi-times" severity="danger" text size="small" (onClick)="removeOption(i, j)" />
                  </div>
                </div>
                <p-button label="Add option" icon="pi pi-plus" text size="small" (onClick)="addOption(i)" />
              </div>
            </div>
          </p-card>
        </ng-container>
      </div>
      <p-button label="Add item" icon="pi pi-plus" text (onClick)="addItem()" />
    </div>

    <div class="mt-4 flex justify-end gap-2">
      <p-button label="Cancel" icon="pi pi-times" text (onClick)="hideDrawer()" />
      <p-button label="Save" icon="pi pi-check" (onClick)="save()" />
    </div>
  </form>
</p-drawer>

<p-toast />
