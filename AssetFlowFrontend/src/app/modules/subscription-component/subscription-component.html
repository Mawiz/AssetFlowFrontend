<p-toolbar styleClass="mb-4">
    <ng-template #start>
        <p-button
            *appHasPermission="Permissions.Subscription.Create"
            label="New"
            icon="pi pi-plus"
            severity="secondary"
            class="mr-2"
            (onClick)="openNew()" />

        <p-button
            label="Delete"
            icon="pi pi-trash"
            severity="secondary"
            outlined
            [disabled]="!selectedSubscriptions || !selectedSubscriptions.length"
            (onClick)="deleteSelectedSubscriptions()" />
    </ng-template>

    <ng-template #end>
        <p-button
            label="Export"
            icon="pi pi-upload"
            severity="secondary"
            (onClick)="exportCSV()" />
    </ng-template>
</p-toolbar>

<p-table
    #dt
    [value]="subscriptions()"
    [rows]="subscriptionFilter.pageSize"
    [paginator]="true"
    [lazy]="true"
    (onPage)="onSubscriptionPage($event)"
    (onSort)="onSort($event)"
    [globalFilterFields]="['name','displayName','description']"
    [(selection)]="selectedSubscriptions"
    dataKey="id"
    [rowHover]="true"
    [rowsPerPageOptions]="[10,20,30]"
    [totalRecords]="totalRecords"
    [customSort]="true"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords} subscriptions">

    <!-- CAPTION -->
    <ng-template #caption>
        <div class="flex justify-between items-center">
            <h5 class="m-0">Manage Subscription Types</h5>

            <div class="flex gap-2">

                <!-- SEARCH -->
                <p-iconfield>
                    <p-inputicon styleClass="pi pi-search" />

                    <input
                        pInputText
                        type="text"
                        [(ngModel)]="subscriptionFilter.searchText"
                        (keydown.enter)="onSubscriptionSearch()"
                        placeholder="Search..." />
                </p-iconfield>

                <!-- FILTER BUTTON -->
                <p-button
                    icon="pi pi-filter"
                    label="Filters"
                    severity="secondary"
                    outlined
                    (click)="filterDialogVisible = true">
                </p-button>

                <p-button
                    icon="pi pi-times"
                    label="Clear"
                    severity="danger"
                    outlined
                    *ngIf="
                        subscriptionFilter.searchText ||
                        subscriptionFilter.isActive !== null ||
                        subscriptionFilter.startDate ||
                        subscriptionFilter.endDate
                    "
                    (click)="clearFilters()">
                </p-button>

            </div>
        </div>
    </ng-template>

    <!-- HEADER -->
    <ng-template #header>
        <tr>
            <th style="width: 3rem">
                <p-tableHeaderCheckbox />
            </th>

        <th pSortableColumn="name">
            Name
            <p-sortIcon field="name"></p-sortIcon>
        </th>

            <th>Display Name</th>

            <th>Description</th>

            <th>Active</th>

            <th style="width: 8rem"></th>
        </tr>
    </ng-template>

    <!-- BODY -->
    <ng-template #body let-sub>
        <tr>

            <td>
                <p-tableCheckbox [value]="sub" />
            </td>

            <td>{{ sub.name }}</td>

            <td>{{ sub.displayName }}</td>

            <td>{{ sub.description }}</td>

            <td>
                <p-tag
                    [value]="sub.isActive ? 'Active' : 'Inactive'"
                    [severity]="sub.isActive ? 'success' : 'danger'"
                    class="cursor-pointer"
                    (click)="toggleActive(sub)">
                </p-tag>
            </td>

            <td class="text-end">

                <p-button
                    *appHasPermission="Permissions.Subscription.Update"
                    icon="pi pi-pencil"
                    class="mr-2"
                    [rounded]="true"
                    [outlined]="true"
                    (click)="editSubscription(sub)">
                </p-button>

                <p-button
                    *appHasPermission="Permissions.Subscription.Delete"
                    icon="pi pi-trash"
                    severity="danger"
                    [rounded]="true"
                    [outlined]="true"
                    (click)="deleteSubscription(sub)">
                </p-button>

            </td>
        </tr>
    </ng-template>

</p-table>

<!-- FILTER DIALOG -->
<p-dialog
    header="Filters"
    [(visible)]="filterDialogVisible"
    [modal]="true"
    [style]="{ width: '400px' }">

    <div class="flex flex-col gap-5 mt-3">

        <!-- START DATE -->
        <div class="flex flex-col gap-2">
            <label>Start Date</label>

            <p-datepicker
                [(ngModel)]="subscriptionFilter.startDate"
                dateFormat="yy-mm-dd"
                [showIcon]="true"
                appendTo="body">
            </p-datepicker>
        </div>

        <!-- END DATE -->
        <div class="flex flex-col gap-2">
            <label>End Date</label>

            <p-datepicker
                [(ngModel)]="subscriptionFilter.endDate"
                dateFormat="yy-mm-dd"
                [showIcon]="true">
            </p-datepicker>
        </div>

        <!-- STATUS -->
        <div class="flex flex-col gap-2">
            <label>Status</label>

            <p-select
                [options]="statusOptions"
                [(ngModel)]="subscriptionFilter.isActive"
                optionLabel="label"
                optionValue="value"
                placeholder="Select Status">
            </p-select>
        </div>

        <!-- BUTTONS -->
        <div class="flex justify-end gap-2 mt-2">

            <p-button
                label="Clear"
                severity="secondary"
                outlined
                (click)="clearFilters()">
            </p-button>

            <p-button
                label="Apply"
                icon="pi pi-check"
                (click)="applyFilters()">
            </p-button>

        </div>

    </div>

</p-dialog>

<!-- DRAWER -->
<p-drawer
    [(visible)]="drawerVisible"
    position="right"
    [modal]="true"
    [blockScroll]="true"
    [closeOnEscape]="true"
    [showCloseIcon]="true"
    [style]="{ width: '400px' }"
    [header]="isEditing ? 'Edit Subscription' : 'Create Subscription'">

    <form [formGroup]="form" class="flex flex-col gap-4">

        <!-- NAME -->
        <div class="flex flex-col gap-2">
            <label for="name">Name</label>

            <input
                pInputText
                id="name"
                formControlName="name" />

            <small
                *ngIf="submitted && form.controls['name'].invalid"
                class="text-red-500">

                Name is required.

            </small>
        </div>

        <!-- DISPLAY NAME -->
        <div class="flex flex-col gap-2">
            <label for="displayName">Display Name</label>

            <input
                pInputText
                id="displayName"
                formControlName="displayName" />

            <small
                *ngIf="submitted && form.controls['displayName'].invalid"
                class="text-red-500">

                Display Name is required.

            </small>
        </div>

        <!-- DESCRIPTION -->
        <div class="flex flex-col gap-2">
            <label for="description">Description</label>

            <textarea
                pInputTextarea
                id="description"
                formControlName="description"
                rows="3">
            </textarea>
        </div>

        <!-- ACTIONS -->
        <div class="mt-4 flex justify-end gap-2">

            <p-button
                label="Cancel"
                icon="pi pi-times"
                text
                (click)="hideDrawer()">
            </p-button>

            <p-button
                label="Save"
                icon="pi pi-check"
                (click)="saveSubscription()">
            </p-button>

        </div>

    </form>

</p-drawer>

<p-confirmdialog [style]="{ width: '450px' }" />

<p-toast />
