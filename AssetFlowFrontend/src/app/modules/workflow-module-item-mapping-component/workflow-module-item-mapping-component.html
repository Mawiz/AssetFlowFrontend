<p-toast />
<p-toolbar styleClass="mb-2">
  <ng-template #start>
    <span class="font-semibold text-lg">Module–item mapping</span>
  </ng-template>
  <ng-template #end>
    <p-select
      *ngIf="systemAdmin"
      [(ngModel)]="filter.tenantId"
      [options]="tenantFilterOptions"
      optionLabel="label"
      optionValue="value"
      placeholder="Tenant"
      (onChange)="onTenantFilterChange()"
      appendTo="body"
      styleClass="mr-2" />
    <p-button *appHasPermission="Permissions.WorkflowModuleItemMapping.Create" label="Add" icon="pi pi-plus" (onClick)="openNew()" />
  </ng-template>
</p-toolbar>

<p-table [value]="rows()" [paginator]="true" [rows]="filter.pageSize" [totalRecords]="totalRecords" [lazy]="true" (onLazyLoad)="load()" styleClass="text-sm">
  <ng-template #header>
    <tr>
      <th>Item type</th>
      <th>Module</th>
      <th *ngIf="systemAdmin">Tenant</th>
      <th>Active</th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template #body let-r>
    <tr>
      <td>{{ r.referenceItemType }}</td>
      <td>{{ r.moduleNameEn || r.moduleId }}</td>
      <td *ngIf="systemAdmin">{{ r.tenantName || r.tenantId }}</td>
      <td>{{ r.isActive ? 'Yes' : 'No' }}</td>
      <td class="text-end">
        <p-button icon="pi pi-pencil" size="small" [rounded]="true" [outlined]="true" class="mr-1" (onClick)="edit(r)" />
        <p-button icon="pi pi-trash" size="small" severity="danger" [rounded]="true" [outlined]="true" (onClick)="remove(r)" />
      </td>
    </tr>
  </ng-template>
</p-table>

<p-drawer [(visible)]="drawerVisible" [style]="{ width: '420px' }" header="Mapping">
  <form [formGroup]="form" class="flex flex-col gap-3">
    <p-select *ngIf="systemAdmin" formControlName="tenantId" [options]="tenantFilterOptions.slice(1)" optionLabel="label" optionValue="value" placeholder="Tenant *" appendTo="body" styleClass="w-full" />
    <p-select formControlName="referenceItemType" [options]="itemTypes" optionLabel="label" optionValue="value" placeholder="Item type *" appendTo="body" styleClass="w-full" />
    <p-select formControlName="moduleId" [options]="modules" optionLabel="moduleNameEn" optionValue="moduleId" placeholder="Workflow module *" appendTo="body" styleClass="w-full" />
    <div class="flex items-center gap-2">
      <p-checkbox formControlName="isActive" [binary]="true" inputId="mapActive" />
      <label for="mapActive">Active</label>
    </div>
    <p-button label="Save" (onClick)="save()" />
  </form>
</p-drawer>
