<p-toolbar styleClass="mb-4">
  <ng-template #start>
    <p-button *appHasPermission="Permissions.MaintenanceType.Create" label="New" icon="pi pi-plus" (onClick)="openNew()" />
  </ng-template>
</p-toolbar>

<p-table [value]="rows()" [lazy]="true" [paginator]="true" [rows]="filter.pageSize" [totalRecords]="totalRecords" (onPage)="onPage($event)">
  <ng-template #caption>
    <div class="grid align-items-center">
      <div class="col-12 md:col-6"><h5 class="m-0">Maintenance Types</h5></div>
      <div class="col-12 md:col-6 text-right">
        <input pInputText [(ngModel)]="filter.searchText" placeholder="Search..." (keydown.enter)="load()" />
        <p-button icon="pi pi-search" class="ml-2" (onClick)="load()" />
      </div>
    </div>
  </ng-template>
  <ng-template #header>
    <tr><th>Code</th><th>Name</th><th>Sort</th><th>Active</th><th></th></tr>
  </ng-template>
  <ng-template #body let-r>
    <tr>
      <td>{{ r.code }}</td><td>{{ r.name }}</td><td>{{ r.sortOrder }}</td><td>{{ r.isActive ? 'Yes' : 'No' }}</td>
      <td><p-button *appHasPermission="Permissions.MaintenanceType.Update" icon="pi pi-pencil" [text]="true" (onClick)="openEdit(r)" /></td>
    </tr>
  </ng-template>
</p-table>

<p-drawer [(visible)]="drawerVisible" header="Maintenance Type" [style]="{ width: '24rem' }">
  <div class="grid formgrid p-fluid">
    <div class="field col-12"><label>Code</label><input pInputText [(ngModel)]="editModel.code" /></div>
    <div class="field col-12"><label>Name</label><input pInputText [(ngModel)]="editModel.name" /></div>
    <div class="field col-12"><label>Description</label><textarea pTextarea rows="3" [(ngModel)]="editModel.description"></textarea></div>
    <div class="field col-12"><label>Sort order</label><p-inputNumber [(ngModel)]="editModel.sortOrder" /></div>
    <div class="field col-12">
      <p-checkbox inputId="mtActive" [binary]="true" [(ngModel)]="editModel.isActive"></p-checkbox>
      <label for="mtActive" class="ml-2">Active</label>
    </div>
  </div>
  <div class="text-right mt-3"><p-button label="Save" (onClick)="save()" /></div>
</p-drawer>
<p-toast />
