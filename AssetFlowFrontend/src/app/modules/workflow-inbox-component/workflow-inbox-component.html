<p-toast />
<p-toolbar styleClass="mb-2">
  <ng-template #start><span class="font-semibold text-lg">Workflow tasks</span></ng-template>
</p-toolbar>

<p-tabs [value]="category.toString()" (valueChange)="onTabChange($event)">
  <p-tablist>
    <p-tab [value]="WorkflowInboxCategory.Created.toString()">Items I Created</p-tab>
    <p-tab [value]="WorkflowInboxCategory.PendingWithMe.toString()">Pending With Me</p-tab>
    <p-tab [value]="WorkflowInboxCategory.View.toString()">View</p-tab>
    <p-tab [value]="WorkflowInboxCategory.PerformedByMe.toString()">Performed By Me</p-tab>
  </p-tablist>
  <p-tabpanels>
    <p-tabpanel [value]="category.toString()">
      <p-table [value]="rows()" [paginator]="true" [rows]="filter.pageSize" [totalRecords]="totalRecords" [lazy]="true" (onLazyLoad)="load()" styleClass="text-sm">
        <ng-template #header>
          <tr>
            <th>Item</th>
            <th>Module</th>
            <th>Stage</th>
            <th>Assignee</th>
            <th>Status</th>
            <th>Assigned</th>
            <th></th>
          </tr>
        </ng-template>
        <ng-template #body let-r>
          <tr>
            <td>{{ r.referenceItemType }} #{{ r.referenceItemId }}</td>
            <td>{{ r.moduleNameEn || '—' }}</td>
            <td>{{ r.stageNameEn || '—' }}</td>
            <td>{{ r.assigneeDisplayName || '—' }}</td>
            <td><p-tag [value]="r.isCompleted ? 'Completed' : 'Open'" [severity]="r.isCompleted ? 'success' : 'warn'" /></td>
            <td>{{ r.assignedAt | date: 'short' }}</td>
            <td class="text-end">
              <p-button label="Open" size="small" (onClick)="openTask(r)" />
            </td>
          </tr>
        </ng-template>
      </p-table>
    </p-tabpanel>
  </p-tabpanels>
</p-tabs>
