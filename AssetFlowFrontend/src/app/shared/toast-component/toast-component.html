    <div class="toast-container top-0 end-0 p-3">
      <div *ngFor="let t of toasts" class="toast align-items-center show" [ngClass]="t.type">
        <div class="d-flex">
          <div class="toast-body">{{ t.message }}</div>
          <button type="button" class="btn-close ms-2 mb-1" (click)="removeToast(t)"></button>
        </div>
      </div>
    </div>
